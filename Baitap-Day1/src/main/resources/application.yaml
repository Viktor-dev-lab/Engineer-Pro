spring:
  application:
    name: BaiTap

  datasource:
    url: jdbc:postgresql://localhost:5433/movie_db
    username: movie_user
    password: movie_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always
